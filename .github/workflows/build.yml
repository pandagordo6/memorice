name: Crear instalador para Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Crear el .exe con PyInstaller
        run: pyinstaller memorice.spec --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear el instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Crear version portable (zip)
        run: Compress-Archive -Path dist\MemoriceFrutas -DestinationPath Output\MemoriceFrutas_Portable.zip

      - name: Guardar archivos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MemoriceFrutas-Windows
          path: |
            Output/MemoriceFrutas_Setup.exe
            Output/MemoriceFrutas_Portable.zip

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/MemoriceFrutas_Setup.exe
            Output/MemoriceFrutas_Portable.zip
